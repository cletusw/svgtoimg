<!DOCTYPE html>
<html>
<head>
  <script type="importmap">
    {
      "imports": {
        "jszip": "https://esm.sh/jszip@3.10.1"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
  <style>
    body {
      background: #e7e7e7;
    }

    #drop-zone {
      max-width: 36rem;
      margin: 1rem 0;
      padding: 1rem;
      border: 2px dashed #777;
    }

    #drop-zone.is-dragging {
      border-color: #165d8f;
      background: #f5fbff;
    }

    #results {
      padding-left: 0;
      list-style: none;
    }

    #results li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      max-width: 36rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid #bbb;
    }

    .error {
      color: #a00;
    }
  </style>
</head>
<body>
  <div id="drop-zone">
    <p>Drop SVG files here, or select them:</p>
    <button id="browse-files" type="button">Browse files</button>
    <input id="file-input" type="file" accept="image/svg+xml,.svg" multiple hidden>
  </div>
  <br>
  <button id="download-all" type="button" disabled>Download all (ZIP)</button>
  <p id="status" role="status" aria-live="polite"></p>
  <p>Files in this batch:</p>
  <ul id="results"></ul>
</body>
</html>
